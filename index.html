<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>taskz</title>
	<link rel="stylesheet" type="text/css" href="assets/css/main.css">
	<!--<link rel="icon" href="/favicon.ico" sizes="any">-->
	<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
</head>
<body>

	<!-- Auth Container - shown when logged out -->
	<div id="auth-container" class="auth-container">
		<div class="auth-box">
			<h1 class="site-title">taskz</h1>
			<h2 id="auth-title">Sign In</h2>
			<form id="auth-form">
				<div class="form-field">
					<input type="email" id="auth-email" placeholder="Email" required>
				</div>
				<div class="form-field">
					<input type="password" id="auth-password" placeholder="Password" required>
				</div>
				<button type="submit" id="auth-submit" class="btn">Sign In</button>
			</form>
			<p class="auth-toggle-text">
				<a href="#" id="auth-toggle">Don't have an account? Sign Up</a>
			</p>
		</div>
	</div>

	<!-- App Content - shown when logged in -->
	<div id="app-content" class="site-container" style="display: none;">

		<div class="app-navbar">
			<h1 class="site-title">taskz</h1>
			<span id="user-email" class="user-email"></span>
			<button id="sign-out-btn" class="btn btn-secondary">Sign Out</button>
			<button id="btn-settings" style="margin-right: 20px"></button>
			<button id="btn-info" style="margin-right: 20px"></button>
			<button id="add-list" class="btn">New category</button>
		</div>

		<!--
		<div class="notice">
			<p><strong>Please note:</strong>
			This is a work in progress, proof of concept and therefore likely to change at any point.</p>
			<p style="text-align: right;"><button>Hide this</button></p>
		</div>
		-->

		<div id="board"></div>

	</div>

	<div class="underlay"></div>

	<modal id="modal--add-list" class="modal add-list">
		<button id="close-modal" class="btn modal--close"><img src="assets/icons/xmark-solid.svg"></button>
		<div class="modal--wrap">
			<div class="modal--header">
				<h2 class="modal--title">Add new task category</h2>
			</div>
			<form id="form--add-list">
				<div class="form-field">
					<input id="column_title" name="column_title" type="text" placeholder="Column title" required>
				</div>
				<div class="form-field">
					<div id="color-picker"></div>
				</div>
				<button type="submit" class="btn">Create category</button>
			</form>
		</div>
	</modal>

	<script async src="assets/js/main.min.js"></script>

</body>
</html>
