<!doctype html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>taskz</title>
		<link rel="stylesheet" type="text/css" href="assets/css/main.css">
		<!--<link rel="icon" href="/favicon.ico" sizes="any">-->
		<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
	</head>

	<body>

		<!-- Auth Container - shown when logged out -->
		<div id="auth-container" class="auth-container">
			<div class="auth-box">
				<h1 class="site-title">taskz</h1>

				<!-- Sign In view -->
				<div id="auth-form-view">
					<h2 id="auth-title">Sign In</h2>
					<form id="auth-form">
						<div class="form-field">
							<input type="email" id="auth-email" placeholder="Email" required>
						</div>
						<div class="form-field form-field--password">
							<input type="password" id="auth-password" placeholder="Password" required>
							<button type="button" class="btn-toggle-password" aria-label="Show password">Show</button>
						</div>
						<button type="submit" id="auth-submit" class="btn">Sign In</button>
					</form>
				</div>

			</div>
		</div>

		<!-- App Content - shown when logged in -->
		<div id="app-content" class="site-container" style="display: none;">

			<div class="app-navbar">
				<div class="app-navbar--left">
					<h1 class="site-title">taskz</h1>
					<!--<span id="user-email" class="user-email"></span>-->
				</div>
				<button id="burger-btn" class="burger-btn" aria-label="Toggle menu" aria-expanded="false">
					<span class="burger-btn--bar"></span>
					<span class="burger-btn--bar"></span>
					<span class="burger-btn--bar"></span>
				</button>
				<div class="app-navbar--right">
					
					<button id="add-list" class="btn">New category</button>
					<button id="sign-out-btn" class="btn btn-secondary">Sign Out</button>
				</div>
			</div>

			<div id="sync-toast" class="sync-toast" style="display: none;">
				<span>Board updated on another device.</span>
				<button id="sync-reload" class="btn btn-small">Reload</button>
				<button id="sync-dismiss" class="sync-toast--dismiss">&times;</button>
			</div>

			<div id="board">
				<!-- Mock Content for Styling if JS is not generating it yet, or to guide the user -->
				<!-- We will let the JS populate it, but I might need to update the JS if I can find the source. -->
			</div>

		</div>

		<div class="underlay"></div>

		<modal id="modal--add-list" class="modal add-list">
			<button id="close-modal" class="btn modal--close"><img src="assets/icons/xmark-solid.svg"></button>
			<div class="modal--wrap">
				<div class="modal--header">
					<h2 class="modal--title">Add new task category</h2>
				</div>
				<form id="form--add-list">
					<div class="form-field">
						<input id="column_title" name="column_title" type="text" placeholder="Column title" required>
					</div>
					<div class="form-field">
						<div id="color-picker"></div>
					</div>
					<button type="submit" class="btn">Create category</button>
				</form>
			</div>
		</modal>

		<modal id="modal--task-detail" class="modal task-detail">
			<button class="btn modal--close modal--close-task"><img src="assets/icons/xmark-solid.svg"></button>
			<div class="modal--wrap">
				<div class="modal--header">
					<h2 class="modal--title">Edit task</h2>
				</div>
				<form id="form--task-detail">
					<div class="form-field">
						<label for="task-detail-title">Title</label>
						<input id="task-detail-title" name="task_title" type="text" placeholder="Task title" required>
					</div>
					<div class="form-row">
						<div class="form-field">
							<label for="task-detail-status">Status</label>
							<select id="task-detail-status" name="task_status"></select>
						</div>
						<div class="form-field">
							<label for="task-detail-priority">Priority</label>
							<select id="task-detail-priority" name="task_priority">
								<option value="none">None</option>
								<option value="low">Low</option>
								<option value="medium">Medium</option>
								<option value="high">High</option>
							</select>
						</div>
					</div>
					<div class="form-field">
						<label for="task-detail-description">Description</label>
						<textarea id="task-detail-description" name="task_description" placeholder="Task description ..." rows="6"></textarea>
					</div>
					<button type="submit" class="btn">Save task</button>
				</form>
			</div>
		</modal>

		<script defer src="assets/js/main.min.js"></script>

	</body>

</html>
