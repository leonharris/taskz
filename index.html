<!doctype html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>taskz</title>
		<link rel="stylesheet" type="text/css" href="assets/css/main.css">
		<!--<link rel="icon" href="/favicon.ico" sizes="any">-->
		<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
	</head>

	<body>

		<!-- Auth Container - shown when logged out -->
		<div id="auth-container" class="auth-container">
			<div class="auth-box">
				<h1 class="site-title"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 106 29"><path  d="M10.5996 9H17v4.4004h-6.4004v7.3994c0 1.2.2006 1.9204.6406 2.4404.52.5999 1.3599.96 2.6397.96.76 0 1.7601-.1202 2.1201-.2002l.7998 4.4004c-.6802.2399-2.2404.3994-3.2402.3994-3.1198-.0001-5.3998-1.0399-6.7198-2.7998-.9999-1.32-1.4394-3.04-1.4394-5.7998v-6.7998H0V9h5.4004V3.5996h5.1992zm18.7393-.4004c2.1998 0 4.1597.7202 5.6797 1.96V9h5v2.2754a1.2 1.2 0 0 0-.0938.0898l-8.832 8.7237-4.0176-3.9317c-.4549-.4865-1.2513-.4866-1.7061 0-.4926.4493-.4926 1.2363 0 1.6856l4.8526 4.792c.4548.4866 1.2502.4867 1.7051 0l8.0918-7.9932v13.7588h-5v-1.5606c-1.5999 1.3599-3.4396 1.9599-5.3995 1.96-2.88 0-5.6003-1.2803-7.3203-3.2803-1.5199-1.7599-2.4804-4.1599-2.4804-6.7998.0001-5.7198 4.2406-10.12 9.5205-10.12m23.1289 0c2.5199 0 5.2805.96 6.5605 1.96l-2.4404 3.7607c-1-.72-2.3198-1.3203-3.7197-1.3203-1.4398 0-2.6393.5598-2.6397 1.5596 0 2.5199 9.3992 1.5204 9.3994 8.2402 0 3.72-3.6397 6-7.7197 6-2.6799 0-5.5198-.9197-7.7998-2.5996l2.5195-3.7197c1.32 1.1999 3.3604 1.9199 5.3203 1.9199 1.4 0 2.4795-.6807 2.4795-1.6406-.0005-2.9197-9.3994-1.8803-9.3994-8.1202.0002-3.7196 3.5997-6.0398 7.4395-6.04m17.1592 6.6807L76.3066 9h7.3204l-9.4805 8.7197 10.6797 10.6807h-7L69.627 20v8.4004h-5.2002V0h5.2002zm34.769-3.0801L94.9971 24h10.1999v4.4004H87.9971v-3.2002l9.2802-11.7998h-8.4804V9h15.5991z"/></svg></h1>

				<!-- Sign In view -->
				<div id="auth-form-view">
					<h2 id="auth-title">Sign In</h2>
					<form id="auth-form">
						<div class="form-field">
							<input type="email" id="auth-email" placeholder="Email" required>
						</div>
						<div class="form-field form-field--password">
							<input type="password" id="auth-password" placeholder="Password" required>
							<button type="button" class="btn-toggle-password" aria-label="Show password">Show</button>
						</div>
						<button type="submit" id="auth-submit" class="btn">Sign In</button>
					</form>
				</div>

			</div>
		</div>

		<!-- App Content - shown when logged in -->
		<div id="app-content" class="site-container" style="display: none;">

			<div class="app-navbar">
				<div class="app-navbar--left">
					<h1 class="site-title"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 106 29"><path  d="M10.5996 9H17v4.4004h-6.4004v7.3994c0 1.2.2006 1.9204.6406 2.4404.52.5999 1.3599.96 2.6397.96.76 0 1.7601-.1202 2.1201-.2002l.7998 4.4004c-.6802.2399-2.2404.3994-3.2402.3994-3.1198-.0001-5.3998-1.0399-6.7198-2.7998-.9999-1.32-1.4394-3.04-1.4394-5.7998v-6.7998H0V9h5.4004V3.5996h5.1992zm18.7393-.4004c2.1998 0 4.1597.7202 5.6797 1.96V9h5v2.2754a1.2 1.2 0 0 0-.0938.0898l-8.832 8.7237-4.0176-3.9317c-.4549-.4865-1.2513-.4866-1.7061 0-.4926.4493-.4926 1.2363 0 1.6856l4.8526 4.792c.4548.4866 1.2502.4867 1.7051 0l8.0918-7.9932v13.7588h-5v-1.5606c-1.5999 1.3599-3.4396 1.9599-5.3995 1.96-2.88 0-5.6003-1.2803-7.3203-3.2803-1.5199-1.7599-2.4804-4.1599-2.4804-6.7998.0001-5.7198 4.2406-10.12 9.5205-10.12m23.1289 0c2.5199 0 5.2805.96 6.5605 1.96l-2.4404 3.7607c-1-.72-2.3198-1.3203-3.7197-1.3203-1.4398 0-2.6393.5598-2.6397 1.5596 0 2.5199 9.3992 1.5204 9.3994 8.2402 0 3.72-3.6397 6-7.7197 6-2.6799 0-5.5198-.9197-7.7998-2.5996l2.5195-3.7197c1.32 1.1999 3.3604 1.9199 5.3203 1.9199 1.4 0 2.4795-.6807 2.4795-1.6406-.0005-2.9197-9.3994-1.8803-9.3994-8.1202.0002-3.7196 3.5997-6.0398 7.4395-6.04m17.1592 6.6807L76.3066 9h7.3204l-9.4805 8.7197 10.6797 10.6807h-7L69.627 20v8.4004h-5.2002V0h5.2002zm34.769-3.0801L94.9971 24h10.1999v4.4004H87.9971v-3.2002l9.2802-11.7998h-8.4804V9h15.5991z"/></svg></h1>
					<!--<span id="user-email" class="user-email"></span>-->
				</div>
				<button id="burger-btn" class="burger-btn" aria-label="Toggle menu" aria-expanded="false">
					<span class="burger-btn--bar"></span>
					<span class="burger-btn--bar"></span>
					<span class="burger-btn--bar"></span>
				</button>
				<div class="app-navbar--right">

				<div class="filter-bar">
					<span class="filter-bar--label">Filter</span>
					<button class="filter-btn filter-btn--high" data-filter="high">High</button>
					<button class="filter-btn filter-btn--medium" data-filter="medium">Medium</button>
					<button class="filter-btn filter-btn--low" data-filter="low">Low</button>
				</div>

				<button id="add-list" class="btn">New category</button>
					<button id="btn-trash" class="btn btn-secondary">Trash</button>
					<button id="sign-out-btn" class="btn btn-secondary">Sign Out</button>
				</div>
			</div>

			<div id="sync-toast" class="sync-toast" style="display: none;">
				<span>Board updated on another device.</span>
				<button id="sync-reload" class="btn btn-small">Reload</button>
				<button id="sync-dismiss" class="sync-toast--dismiss">&times;</button>
			</div>

			<div id="board">
				<!-- Mock Content for Styling if JS is not generating it yet, or to guide the user -->
				<!-- We will let the JS populate it, but I might need to update the JS if I can find the source. -->
			</div>

		</div>

		<div class="underlay"></div>

		<modal id="modal--add-list" class="modal add-list">
			<button id="close-modal" class="btn modal--close"><img src="assets/icons/xmark-solid.svg"></button>
			<div class="modal--wrap">
				<div class="modal--header">
					<h2 class="modal--title">Add new task category</h2>
				</div>
				<form id="form--add-list">
					<div class="form-field">
						<input id="column_title" name="column_title" type="text" placeholder="Column title" required>
					</div>
					<div class="form-field">
						<div id="color-picker"></div>
					</div>
					<button type="submit" class="btn">Create category</button>
				</form>
			</div>
		</modal>

		<modal id="modal--task-detail" class="modal task-detail">
			<button class="btn modal--close modal--close-task"><img src="assets/icons/xmark-solid.svg"></button>
			<div class="modal--wrap">
				<div class="modal--header">
					<h2 class="modal--title">Edit task</h2>
				</div>
				<form id="form--task-detail">
					<div class="form-field">
						<label for="task-detail-title">Title</label>
						<input id="task-detail-title" name="task_title" type="text" placeholder="Task title" required>
					</div>
					<div class="form-row">
						<div class="form-field">
							<label for="task-detail-status">Status</label>
							<select id="task-detail-status" name="task_status"></select>
						</div>
						<div class="form-field">
							<label for="task-detail-priority">Priority</label>
							<select id="task-detail-priority" name="task_priority">
								<option value="none">None</option>
								<option value="low">Low</option>
								<option value="medium">Medium</option>
								<option value="high">High</option>
							</select>
						</div>
					</div>
					<div class="form-field">
						<label for="task-detail-description">Description</label>
						<textarea id="task-detail-description" name="task_description" placeholder="Task description ..." rows="6"></textarea>
					</div>
					<button type="submit" class="btn">Save task</button>
				</form>
			</div>
		</modal>

		<modal id="modal--trash" class="modal trash-modal">
			<button id="close-trash-modal" class="btn modal--close"><img src="assets/icons/xmark-solid.svg"></button>
			<div class="modal--wrap">
				<div class="modal--header trash-modal--header">
					<h2 class="modal--title">Trash</h2>
					<p class="trash-modal--subtitle">Tasks are permanently deleted after 6 months.</p>
					<button id="btn-empty-trash" class="btn btn-secondary btn-small">Empty trash</button>
				</div>
				<div id="trash-list" class="trash-list"></div>
			</div>
		</modal>

		<script defer src="assets/js/main.min.js"></script>

	</body>

</html>
